version: '3'

services:
  base: &base
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        EXECJS_RUNTIME: 'Node'
        RAILS_ENV: 'production'
        RAILS_SERVE_STATIC_FILES: 'true'
        SECRET_KEY_BASE: ${SECRET_KEY_BASE:-temp_secret_key_base_for_build}
    env_file: .env
    volumes:
      - /data/storage:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
      - sidekiq
    ports:
      - '127.0.0.1:3000:3000'  # Voltando para 127.0.0.1 para maior segurança
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - RAILS_SERVE_STATIC_FILES=true
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'  # Voltando para 127.0.0.1 para maior segurança
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-chatwoot}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-chatwootdefault}
    volumes:
      - /data/redis:/data
    ports:
      - '127.0.0.1:6379:6379'  # Voltando para 127.0.0.1 para maior segurança

volumes:
  # Mantidos os volumes apenas como referência, mas não estamos usando-os
  # pois agora estamos usando caminhos absolutos como em production.yaml
  postgres:
  redis:
  bundle:
  node_modules:
  packs:
  cache:
